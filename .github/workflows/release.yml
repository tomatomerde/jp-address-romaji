name: Release

# Publishes jp-address-romaji-data and jp-address-romaji to npm.
#
# Two triggers:
#   - tag push: the normal release path. dry_run is forced off, a GitHub
#     Release is created from the matching CHANGELOG.md section, and the
#     tag's shape decides what publishes:
#       - `v1.2.3`      -> both packages, each package.json must read 1.2.3
#       - `data-v1.2.3` -> jp-address-romaji-data only, its package.json
#                          must read 1.2.3 (core's version is untouched and
#                          not checked)
#       - `core-v1.2.3` -> jp-address-romaji only, its package.json must
#                          read 1.2.3 (data's version is untouched and not
#                          checked)
#     Any other tag shape fails the run explicitly rather than guessing.
#     See docs/releasing.md for the full table.
#   - workflow_dispatch: for testing the whole pipeline (dry_run defaults to
#     true) or for re-running a release that failed partway — e.g. the data
#     package published but core didn't — without cutting a new tag. No
#     GitHub Release is created from a dispatch run, and — because there is
#     no tag — no version check runs either; it publishes whatever version
#     is currently on disk for the selected package(s). The version(s) about
#     to be published are always logged and written to the step summary so
#     that's not silent.
#
# The one destructive action in here is `npm publish`. Everything before it —
# dataset build, assumption check, full test suite, packing, type-check on
# the packed output, packed-tarball content assertions, import smoke test —
# runs identically whether dry_run is true or false, so a dry run proves the
# release would have worked, not just that the workflow parses.

on:
  push:
    tags: ['v*', 'data-v*', 'core-v*']
  workflow_dispatch:
    inputs:
      packages:
        description: 'Which package(s) to publish'
        type: choice
        options: ['both', 'data-only', 'core-only']
        default: 'both'
      dry_run:
        description: 'Run every check but skip the actual npm publish'
        type: boolean
        default: true
      concurrency:
        description: 'Parallel downloads for the dataset build (matches the refresh workflow)'
        type: string
        default: '8'

# contents: write is for the GitHub Release created on a tag push.
# id-token: write is what lets npm mint a provenance attestation for the
# published tarballs (see the publish step). Nothing else here needs
# elevated permissions.
permissions:
  contents: write
  id-token: write

# One release at a time, full stop. A second run queued behind this one
# waits rather than running in parallel — two overlapping runs could both
# decide a version isn't on npm yet and race to publish it. Never cancel a
# run already in flight: an in-progress `npm publish` (or the GitHub Release
# creation right after it) being killed mid-step is a worse outcome than
# whatever queued behind it waiting a few extra minutes.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # The dataset build alone can take several minutes over ~1,900 requests;
    # leave headroom for typecheck/build/test/pack/attw on top of that.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # -----------------------------------------------------------------
      # Plan: work out, once, what this run is trying to do, so every later
      # step branches on a plain env var instead of re-deriving
      # event_name/inputs logic each time.
      #
      # Tag shape decides scope on a push: `v<version>` means both packages,
      # `data-v<version>` / `core-v<version>` mean just that one. This is
      # the only place that parses the tag string — everything downstream
      # reads PUBLISH_DATA / PUBLISH_CORE / EXPECTED_VERSION.
      # -----------------------------------------------------------------
      - name: Determine release plan
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
            case "$TAG" in
              v[0-9]*)
                SCOPE="both"
                EXPECTED_VERSION="${TAG#v}"
                RELEASE_TITLE="$TAG"
                ;;
              data-v[0-9]*)
                SCOPE="data-only"
                EXPECTED_VERSION="${TAG#data-v}"
                RELEASE_TITLE="jp-address-romaji-data $TAG"
                ;;
              core-v[0-9]*)
                SCOPE="core-only"
                EXPECTED_VERSION="${TAG#core-v}"
                RELEASE_TITLE="jp-address-romaji $TAG"
                ;;
              *)
                echo "::error::Unrecognized tag '$TAG'. Expected v<version> (both packages), data-v<version> (data only), or core-v<version> (core only) — see docs/releasing.md." >&2
                exit 1
                ;;
            esac
            echo "TAG=$TAG" >> "$GITHUB_ENV"
            echo "EXPECTED_VERSION=$EXPECTED_VERSION" >> "$GITHUB_ENV"
            echo "RELEASE_TITLE=$RELEASE_TITLE" >> "$GITHUB_ENV"
            echo "CHECK_VERSION=true" >> "$GITHUB_ENV"
            echo "DRY_RUN=false" >> "$GITHUB_ENV"
            echo "CREATE_RELEASE=true" >> "$GITHUB_ENV"
            PACKAGES_INPUT="$SCOPE"
          else
            echo "CHECK_VERSION=false" >> "$GITHUB_ENV"
            echo "DRY_RUN=${{ github.event.inputs.dry_run }}" >> "$GITHUB_ENV"
            echo "CREATE_RELEASE=false" >> "$GITHUB_ENV"
            PACKAGES_INPUT="${{ github.event.inputs.packages }}"
          fi

          case "$PACKAGES_INPUT" in
            both)      echo "PUBLISH_DATA=true"  >> "$GITHUB_ENV"; echo "PUBLISH_CORE=true"  >> "$GITHUB_ENV" ;;
            data-only) echo "PUBLISH_DATA=true"  >> "$GITHUB_ENV"; echo "PUBLISH_CORE=false" >> "$GITHUB_ENV" ;;
            core-only) echo "PUBLISH_DATA=false" >> "$GITHUB_ENV"; echo "PUBLISH_CORE=true"  >> "$GITHUB_ENV" ;;
            *) echo "Unknown packages input: '$PACKAGES_INPUT'" >&2; exit 1 ;;
          esac

          echo "CONCURRENCY=${{ github.event.inputs.concurrency || '8' }}" >> "$GITHUB_ENV"

      # -----------------------------------------------------------------
      # Make the target version(s) visible even on the paths that don't
      # verify them (workflow_dispatch has no tag to check against — see
      # the version-guard step below). This is the one place a human
      # skimming a dispatch run's summary can catch "that's not the version
      # I meant to publish" before npm publish does.
      # -----------------------------------------------------------------
      - name: Log target package versions
        shell: bash
        run: |
          {
            echo "## Release plan"
            echo ""
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- dry_run: \`$DRY_RUN\`"
          } >> "$GITHUB_STEP_SUMMARY"
          # The dist-tag is shown here because it is the one field whose
          # wrong value is silent and public: an rc landing on `latest`
          # looks like a successful release right up until someone runs
          # `npm install`.
          if [ "$PUBLISH_DATA" = "true" ]; then
            v=$(node -p "require('./packages/data/package.json').version")
            case "$v" in *-*) t=next ;; *) t=latest ;; esac
            echo "Will publish jp-address-romaji-data @ $v (dist-tag: $t)"
            echo "- jp-address-romaji-data: \`$v\` → dist-tag \`$t\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$PUBLISH_CORE" = "true" ]; then
            v=$(node -p "require('./packages/core/package.json').version")
            case "$v" in *-*) t=next ;; *) t=latest ;; esac
            echo "Will publish jp-address-romaji @ $v (dist-tag: $t)"
            echo "- jp-address-romaji: \`$v\` → dist-tag \`$t\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      # -----------------------------------------------------------------
      # Version guard: publishing the wrong version is worse than not
      # publishing at all. Only meaningful for a tag push — workflow_dispatch
      # has no tag to check against, and publishes whatever version is
      # currently on disk (that's the "re-run a stuck release" use case).
      #
      # Scoped to the package(s) this tag is actually publishing: a
      # `data-v*` tag only checks packages/data/package.json. Checking core's
      # version too would make a data-only release fail every time core's
      # version isn't also at that number, which is the normal state — data
      # and core are allowed to be on independent version cycles.
      # -----------------------------------------------------------------
      - name: Verify tag matches package versions
        if: env.CHECK_VERSION == 'true'
        shell: bash
        run: |
          fail=false
          if [ "$PUBLISH_DATA" = "true" ]; then
            name=$(node -p "require('./packages/data/package.json').name")
            version=$(node -p "require('./packages/data/package.json').version")
            if [ "$version" != "$EXPECTED_VERSION" ]; then
              echo "::error::$name is at $version but tag $TAG expects $EXPECTED_VERSION" >&2
              fail=true
            fi
          fi
          if [ "$PUBLISH_CORE" = "true" ]; then
            name=$(node -p "require('./packages/core/package.json').name")
            version=$(node -p "require('./packages/core/package.json').version")
            if [ "$version" != "$EXPECTED_VERSION" ]; then
              echo "::error::$name is at $version but tag $TAG expects $EXPECTED_VERSION" >&2
              fail=true
            fi
          fi
          if [ "$fail" = "true" ]; then
            exit 1
          fi

      # -----------------------------------------------------------------
      # CHANGELOG guard: a tag whose CHANGELOG section is missing, or still
      # says "unreleased", produces a real, published GitHub Release with
      # placeholder text in its body. Catch that mechanically instead of
      # relying on whoever cuts the tag to have followed docs/releasing.md.
      #
      # Tag-push only (CHECK_VERSION mirrors that), and hard-fails there
      # since tag pushes always run with DRY_RUN=false. The dry_run branch
      # exists so the same check degrades to a warning rather than a hard
      # failure if it's ever reached under dry_run=true.
      # -----------------------------------------------------------------
      - name: Check CHANGELOG has a dated section for this release
        if: env.CHECK_VERSION == 'true'
        shell: bash
        run: |
          # Match the version as a whole field, not as a line prefix. A
          # prefix match makes "## 0.1.0" also match "## 0.1.0-rc.1 — …",
          # so once a prerelease section exists the real release binds to
          # the wrong section — and because both headings match, the
          # `exit` rule never fires and the "section" becomes the rest of
          # the file. Verified against a fixture with rc.1, 0.1.0 and
          # 0.0.9 sections: each version now selects only its own.
          heading="## $EXPECTED_VERSION"
          section=$(awk -v want="$EXPECTED_VERSION" '
            /^## / { if ($2 == want) { found=1; print; next } else if (found) exit }
            found { print }
          ' CHANGELOG.md)

          problem=""
          if [ -z "$section" ]; then
            problem="No '$heading' section found in CHANGELOG.md."
          elif echo "$section" | grep -qi 'unreleased'; then
            problem="CHANGELOG.md's '$heading' section still says 'unreleased'."
          fi

          if [ -n "$problem" ]; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "::warning::$problem Fix before the real tag push."
            else
              echo "::error::$problem Replace it with the release date before tagging (see docs/releasing.md)." >&2
              exit 1
            fi
          else
            echo "CHANGELOG.md has a dated section for $EXPECTED_VERSION."
          fi

      # -----------------------------------------------------------------
      # Build the real dataset on the runner. Unlike a network-restricted
      # development environment, the runner reaches Geolonia. Output goes
      # straight into packages/data/data — not an arbitrary ./address-data
      # like the refresh workflow uses — because that's what check:publishable
      # and the data package's `files` field look at.
      #
      # This always runs, even for a core-only release: the test suite below
      # needs a real dataset to exercise realdata.test.ts, and there's no
      # reason a core-only release should skip proving the library still
      # works against current data.
      # -----------------------------------------------------------------
      - name: Build the dataset
        run: |
          npx tsx packages/data/src/build-data.ts \
            --out ./packages/data/data \
            --concurrency "$CONCURRENCY"

      # Blocking, unlike the refresh workflow's `continue-on-error: true`:
      # that workflow produces a report for a human to read later; this is a
      # release, and a violated assumption (like either landmine documented
      # in CLAUDE.md) means the library will silently refuse addresses it
      # used to handle. `set -o pipefail` is required — without it the exit
      # status downstream of `tee` is tee's, not verify-data-assumptions',
      # so a failing check would be reported as green.
      - name: Verify data assumptions (blocking)
        shell: bash
        run: |
          set -o pipefail
          npx tsx scripts/verify-data-assumptions.ts --data ./packages/data/data | tee assumptions.txt

      # Root script, not `pnpm -r`: also typechecks the test files, scripts/
      # (including verify-data-assumptions.ts, which the step above just ran
      # via tsx with types stripped), and vitest.config.ts.
      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm -r build

      # Independent step, not relying on prepublishOnly: the actual publish
      # step below runs `npm publish <tarball>`, and publishing a pre-built
      # tarball does not run any lifecycle scripts (verified locally —
      # prepublishOnly fires for `npm publish <directory>` but never for
      # `npm publish some.tgz`; `pnpm pack` doesn't run it either). Without
      # this explicit step, the one guard that stops a dataset-less package
      # from shipping would never run in this pipeline.
      - name: Check the data package is publishable
        run: pnpm --filter jp-address-romaji-data run check:publishable

      # JP_ADDRESS_ROMAJI_DATA_DIR switches on realdata.test.ts, which is
      # skipped everywhere else. Blocking: this is the only thing in the
      # whole pipeline that proves the dataset just built actually
      # round-trips real addresses, not just that it has the expected file
      # count.
      - name: Test (fixtures + real dataset)
        env:
          JP_ADDRESS_ROMAJI_DATA_DIR: ./packages/data/data
        run: pnpm test

      # -----------------------------------------------------------------
      # Pack. `pnpm pack` (not `npm pack`) matters here: it rewrites
      # `workspace:*` protocol dependencies to the real published version
      # before archiving — packages/core's devDependency on
      # jp-address-romaji-data is `workspace:*` in the source tree and
      # `0.1.0` inside a `pnpm pack` tarball (verified) — where `npm publish`
      # run directly on a directory would leave `workspace:*` untouched and
      # produce an uninstallable package. Packing once, here, means every
      # check below (the tarball-content asserts, attw, import smoke test,
      # the eventual publish) inspects the exact bytes that would ship, not
      # a re-derived approximation.
      # -----------------------------------------------------------------
      - name: Pack data tarball
        if: env.PUBLISH_DATA == 'true'
        working-directory: packages/data
        run: pnpm pack --pack-destination "$RUNNER_TEMP/tarballs"

      - name: Pack core tarball
        if: env.PUBLISH_CORE == 'true'
        working-directory: packages/core
        run: pnpm pack --pack-destination "$RUNNER_TEMP/tarballs"

      - name: Summarize tarball contents
        shell: bash
        run: |
          echo '## Tarball contents' >> "$GITHUB_STEP_SUMMARY"
          for f in "$RUNNER_TEMP"/tarballs/*.tgz; do
            [ -e "$f" ] || continue
            echo "### $(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tar -tzf "$f" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      # -----------------------------------------------------------------
      # `check:publishable` (above) only looks at the working directory's
      # packages/data/data. It has never seen the tarball that is about to
      # be published. `files` currently overrides .gitignore correctly
      # (verified locally), but that is a property of today's package.json —
      # a future `packages/data/.npmignore`, or a `files` edit that drops
      # `data`, would silently ship an empty-of-data package with nothing
      # in this pipeline noticing. Assert against the packed bytes
      # themselves, not the working tree.
      # -----------------------------------------------------------------
      - name: Assert data tarball contents
        if: env.PUBLISH_DATA == 'true'
        shell: bash
        run: |
          version=$(node -p "require('./packages/data/package.json').version")
          f="$RUNNER_TEMP/tarballs/jp-address-romaji-data-$version.tgz"

          # Materialize the listing once; never pipe `tar` into `grep`.
          # `grep -q` exits at its first match, closing the pipe and killing
          # `tar` with SIGPIPE. Under `-eo pipefail` that non-zero status
          # becomes the pipeline's, so this check reported "missing"
          # precisely BECAUSE the entry was present and matched early. npm
          # sorts `data/ja.json` ahead of `data/ja/...` ('.' < '/'), so it
          # matched on the first line of a ~124 KB listing, every time. The
          # check could not pass: a genuinely absent entry fails it too, for
          # the honest reason, so the two outcomes were indistinguishable.
          # Found by the first real dry run of this workflow (2026-08-10);
          # reproduced locally with a tarball built in npm's sort order.
          listing="$RUNNER_TEMP/data-tarball-listing.txt"
          tar -tzf "$f" > "$listing"

          if ! grep -qx 'package/data/ja.json' "$listing"; then
            echo "::error::$f is missing package/data/ja.json" >&2
            exit 1
          fi

          # Matches check-publishable.mjs's own threshold (~1,899
          # municipalities, guarded at 1800 there for the same reason).
          # `|| true` is load-bearing. This step runs under `-eo pipefail`,
          # and `grep -c` exits 1 when it counts zero — so on the one failure
          # this check exists to catch (no dataset in the tarball at all) the
          # assignment itself would abort the step before the error message
          # below ever prints. The run would fail, but say nothing about why.
          city_files=$(grep -Ec '^package/data/ja/[^/]+/[^/]+\.json$' "$listing" || true)
          if [ "$city_files" -lt 1800 ]; then
            echo "::error::$f has only $city_files municipality files under package/data/ja/ (need >= 1800)" >&2
            exit 1
          fi

          echo "Data tarball OK: package/data/ja.json + $city_files municipality files."

      - name: Assert core tarball contents
        if: env.PUBLISH_CORE == 'true'
        shell: bash
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          f="$RUNNER_TEMP/tarballs/jp-address-romaji-$version.tgz"

          # Same reason as the data assertion above: grep a materialized
          # listing, never a pipe from `tar`. Core's listing is small enough
          # today that it fits in the 64 KB pipe buffer, so `tar` finishes
          # writing before `grep -q` can SIGPIPE it and the bug stays
          # dormant here. That is the argument for fixing it now rather than
          # when dist/ grows past the buffer — at which point this step
          # would start reporting a present file as missing.
          listing="$RUNNER_TEMP/core-tarball-listing.txt"
          tar -tzf "$f" > "$listing"

          fail=false
          for entry in package/dist/index.js package/dist/index.d.ts; do
            if ! grep -qx "$entry" "$listing"; then
              echo "::error::$f is missing $entry" >&2
              fail=true
            fi
          done
          if [ "$fail" = "true" ]; then
            exit 1
          fi

          echo "Core tarball OK: package/dist/index.js + package/dist/index.d.ts present."

      # esm-only profile confirmed present in @arethetypeswrong/cli (checked
      # `--help`; exit 0 against this package's tarball with it, exit 1 under
      # the default "strict" profile). Both packages are ESM-only by design
      # — see CLAUDE.md and README "Requirements" — so the strict profile's
      # CJS-resolution warnings (node10, node16-from-require) are expected
      # noise, not a defect. esm-only silences exactly those two checks and
      # leaves node16-from-ESM and bundler resolution blocking.
      - name: Check package types (arethetypeswrong, esm-only)
        shell: bash
        run: |
          for f in "$RUNNER_TEMP"/tarballs/*.tgz; do
            [ -e "$f" ] || continue
            echo "::group::attw $(basename "$f")"
            npx --yes @arethetypeswrong/cli --profile esm-only "$f"
            echo "::endgroup::"
          done

      # Proves the built dist/ is actually importable, not just that tsc
      # exited 0. Runs against the workspace dist/ rather than unpacking the
      # tarball — pack only rewrites package.json, dist/ is byte-identical —
      # which avoids an extra extract-and-install step.
      - name: Import smoke test
        shell: bash
        run: |
          if [ "$PUBLISH_CORE" = "true" ]; then
            node --input-type=module -e \
              "import('./packages/core/dist/index.js').then(m => console.log('core exports:', Object.keys(m)))"
          fi
          if [ "$PUBLISH_DATA" = "true" ]; then
            node --input-type=module -e \
              "import('./packages/data/dist/index.js').then(m => console.log('data exports:', Object.keys(m)))"
          fi

      # -----------------------------------------------------------------
      # Publish. Data before core: the library fails every conversion with
      # DATA_NOT_CONFIGURED without a dataset, so there's no reason to ship
      # core against a data version that doesn't exist on the registry yet.
      #
      # provenance: enabled. It was off while the repository was private —
      # npm's provenance feature requires a public source repository — and
      # was turned on when the repository went public on 2026-08-10. Both
      # publish commands below use `npm`, not `pnpm publish` (9.15.0 has no
      # --provenance flag at all), and the job asks for `id-token: write`
      # above so npm can exchange an OIDC token for a Sigstore attestation.
      #
      # npm cross-checks the manifest's `repository.url` against the
      # repository the workflow is running in and refuses to publish if they
      # disagree. Both packages point at
      # git+https://github.com/tomatomerde/jp-address-romaji.git, which is
      # this repository — keep it that way, or provenance starts failing the
      # release rather than silently degrading.
      #
      # Authentication is still the NPM_TOKEN .npmrc below, not npm's
      # tokenless OIDC ("trusted publishing") flow. That flow needs a
      # trusted publisher configured on the npm side per package, which
      # cannot be done before the package exists. Worth revisiting after
      # 0.1.0 is on the registry; provenance itself does not depend on it.
      #
      # .npmrc is written only when this run could actually publish
      # (DRY_RUN != 'true'). Writing it unconditionally — including during a
      # dry run, before NPM_TOKEN is known to even be set — used to mean a
      # dry run with no secret configured wrote an auth line with an empty
      # token, which can make `npm view` below fail with 401 for a reason
      # that has nothing to do with what the dry run is supposed to be
      # proving. If NPM_TOKEN is unset on a real (non-dry-run) publish, fail
      # here with an explicit message instead of writing an empty-token
      # .npmrc and letting a later `npm publish` 401 stand in for it.
      # -----------------------------------------------------------------
      - name: Configure npm auth
        if: env.DRY_RUN != 'true' && (env.PUBLISH_DATA == 'true' || env.PUBLISH_CORE == 'true')
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN Actions secret is not set. Set it before running a real (non-dry-run) release — see docs/releasing.md 'One-time setup'." >&2
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"

          # Confirm the token authenticates at all before the publish steps.
          # This catches a revoked, expired or mistyped token, which would
          # otherwise surface as a bare 401 from `npm publish`. It does NOT
          # catch a token of the wrong *type* — a classic "Publish" token
          # passes `whoami` and then fails at publish with EOTP, which the
          # publish steps below explain.
          if ! whoami_out=$(npm whoami 2>&1); then
            echo "::error::NPM_TOKEN is set but npm rejected it: ${whoami_out}. Regenerate the token and update the secret — see docs/releasing.md 'One-time setup'." >&2
            exit 1
          fi
          echo "Authenticated to npm as ${whoami_out}."

      # `npm view <pkg>@<version>` exits non-zero both when the package name
      # doesn't exist at all and when it exists but that version doesn't
      # (verified against the registry: both cases give exit 1) — either way
      # "not yet published" and safe to proceed.
      #
      # --tag is not optional here. `npm publish` with no --tag always moves
      # the `latest` dist-tag, including for semver prereleases — npm does
      # not special-case them. Publishing 0.1.0-rc.1 without this would make
      # `npm install jp-address-romaji` hand everyone the release candidate,
      # and the only repair is publishing a real version afterwards. A
      # version containing `-` is a prerelease and goes to `next`; anything
      # else goes to `latest`. Keep both publish steps in agreement.
      - name: Publish jp-address-romaji-data
        if: env.PUBLISH_DATA == 'true'
        shell: bash
        run: |
          version=$(node -p "require('./packages/data/package.json').version")
          case "$version" in *-*) dist_tag=next ;; *) dist_tag=latest ;; esac
          if npm view "jp-address-romaji-data@$version" version >/dev/null 2>&1; then
            echo "jp-address-romaji-data@$version is already on npm; skipping."
          elif [ "$DRY_RUN" = "true" ]; then
            echo "[dry run] would publish jp-address-romaji-data@$version --tag $dist_tag"
          else
            ./scripts/npm-publish.sh "jp-address-romaji-data" "$dist_tag" \
              "$RUNNER_TEMP/tarballs/jp-address-romaji-data-$version.tgz"
          fi

      - name: Publish jp-address-romaji
        if: env.PUBLISH_CORE == 'true'
        shell: bash
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          case "$version" in *-*) dist_tag=next ;; *) dist_tag=latest ;; esac
          if npm view "jp-address-romaji@$version" version >/dev/null 2>&1; then
            echo "jp-address-romaji@$version is already on npm; skipping."
          elif [ "$DRY_RUN" = "true" ]; then
            echo "[dry run] would publish jp-address-romaji@$version --tag $dist_tag"
          else
            ./scripts/npm-publish.sh "jp-address-romaji" "$dist_tag" \
              "$RUNNER_TEMP/tarballs/jp-address-romaji-$version.tgz"
          fi

      - name: Remove npm auth
        if: always()
        run: rm -f "$HOME/.npmrc"

      # -----------------------------------------------------------------
      # GitHub Release, tag pushes only. Best-effort notes extraction from
      # CHANGELOG.md: pulls the section under the heading that starts with
      # "## <version>", which is why docs/releasing.md asks you to replace
      # the "unreleased" heading with "<version> — <date>" before tagging
      # (and why the CHANGELOG guard step above fails the run if that never
      # happened). If extraction still comes up empty, fall back to a
      # generic body rather than failing an otherwise-good release over
      # release-notes formatting. `index($0, heading) == 1` is a fixed-string
      # prefix match, not `~`/regex — EXPECTED_VERSION contains literal `.`
      # characters that a regex would treat as "any character".
      # -----------------------------------------------------------------
      - name: Extract changelog section
        if: env.CREATE_RELEASE == 'true' && env.DRY_RUN != 'true'
        shell: bash
        run: |
          awk -v want="$EXPECTED_VERSION" '
            /^## / { if ($2 == want) { found=1; print; next } else if (found) exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            {
              echo "## $TAG"
              echo ""
              echo "See CHANGELOG.md."
            } > release-notes.md
          fi

      - name: Create GitHub Release
        if: env.CREATE_RELEASE == 'true' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --title "$RELEASE_TITLE" --notes-file release-notes.md
