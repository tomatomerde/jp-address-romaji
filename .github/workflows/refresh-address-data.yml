name: Refresh address data and coverage

# Builds the offline dataset from the upstream Geolonia v2 API, then measures
# what it actually contains and checks the assumptions the library's heuristics
# depend on.
#
# This exists because the dataset host is not reachable from every environment
# (a sandbox that allows only an allowlist of domains will not reach it). GitHub
# Actions runners can, so this job does the fetch on your behalf and can be
# started from anywhere — including a phone, via "Run workflow".
#
# The dataset itself is NOT committed: it is uploaded as an artifact. Only the
# generated coverage report is committed, and only when asked.

on:
  workflow_dispatch:
    inputs:
      commit_report:
        description: 'Commit the regenerated docs/coverage.md to this branch'
        type: boolean
        default: true
      concurrency:
        description: 'Parallel downloads (raise to go faster, lower if throttled)'
        type: string
        default: '8'
  schedule:
    # Monthly, so a dataset change that breaks an assumption surfaces on its own.
    - cron: '0 3 1 * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the offline dataset
        run: |
          npx tsx packages/data/src/build-data.ts \
            --out ./address-data \
            --concurrency "${{ github.event.inputs.concurrency || '8' }}"

      - name: Report dataset size
        run: du -sh ./address-data && find ./address-data -name '*.json' | wc -l

      # Non-blocking: this is a report, and a violated assumption should be read
      # and judged rather than silently failing the run that produced the data.
      - name: Check dataset assumptions
        id: assumptions
        continue-on-error: true
        # pipefail matters: without it the exit status is tee's, so a violated
        # assumption would be reported as a passing step.
        shell: bash
        run: |
          set -o pipefail
          npx tsx scripts/verify-data-assumptions.ts --data ./address-data | tee assumptions.txt

      - name: Measure coverage
        run: npx tsx scripts/measure-coverage.ts --data ./address-data > docs/coverage.md

      # JP_ADDRESS_ROMAJI_DATA_DIR switches on realdata.test.ts, which is
      # skipped everywhere else. Without it this step would re-run the same
      # fixture-based suite CI already ran and prove nothing about the data
      # just downloaded.
      - name: Run the test suite against the real dataset
        id: realdata_tests
        continue-on-error: true
        env:
          JP_ADDRESS_ROMAJI_DATA_DIR: ./address-data
        run: pnpm test

      - uses: actions/upload-artifact@v7
        with:
          name: address-data
          path: address-data/
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            docs/coverage.md
            assumptions.txt
          retention-days: 30

      # The two steps above are continue-on-error so that a violated assumption
      # or a failing test still leaves you with the dataset and the reports —
      # that is the point of this workflow. The cost is that the run goes green
      # either way, and the one step that proves the library works against real
      # data becomes invisible unless someone opens the log. So state both
      # outcomes at the top of the summary, where they are read.
      - name: Summarize into the run page
        if: always()
        env:
          ASSUMPTIONS: ${{ steps.assumptions.outcome }}
          REALDATA: ${{ steps.realdata_tests.outcome }}
        run: |
          verdict() { [ "$1" = success ] && echo '✅ passed' || echo "⚠️ $1 — read the log before trusting this dataset"; }
          {
            echo '## Verdict'
            echo
            echo '| Check | Result |'
            echo '| --- | --- |'
            echo "| Dataset assumptions | $(verdict "$ASSUMPTIONS") |"
            echo "| Test suite against the real dataset | $(verdict "$REALDATA") |"
            echo
            echo 'Both are non-blocking, so the run is green regardless. The table is the result.'
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          echo '## Dataset assumptions' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat assumptions.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '## Coverage' >> "$GITHUB_STEP_SUMMARY"
          head -40 docs/coverage.md >> "$GITHUB_STEP_SUMMARY"

      # Branch protection on main (once enabled — see the maintainer runbook in
      # docs/project-status.md) rejects direct pushes whose commits have not
      # passed the required status checks, and on a free personal plan the bot
      # cannot be exempted. When that happens this step must degrade to a
      # warning, not fail the run: the dataset build and the assumption report
      # above are the point of this workflow, and both have already succeeded.
      # The regenerated report is always in the `reports` artifact either way.
      - name: Commit the coverage report
        if: github.event.inputs.commit_report != 'false'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git diff --quiet docs/coverage.md; then
            echo 'Coverage report unchanged.'
          elif git add docs/coverage.md \
              && git commit -m 'Regenerate coverage report from the v2 dataset' \
              && git push; then
            echo 'Coverage report committed.'
          else
            echo "::warning file=docs/coverage.md::Could not push the regenerated coverage report (branch protection rejects direct pushes once enabled). Download it from this run's 'reports' artifact and commit it via a pull request."
          fi
