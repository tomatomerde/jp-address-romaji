name: Check CLAUDE.md drift

# NOTE FOR CONTRIBUTORS: this is a maintainer-only housekeeping check, and it is
# not something your pull request has to satisfy. It compares the second half of
# CLAUDE.md against a shared template kept in a private repository, and it only
# ever emits a warning. On a pull request from a fork the job still runs and
# passes, but the comparison is skipped with a notice, because GitHub does not
# pass secrets to fork-triggered workflows. Nothing about your contribution is
# being judged here.
#
# Copy this file into a project repository's .github/workflows/ directory.
#
# It compares the common section ("ここから下は共通" and below) of the
# project's CLAUDE.md against the canonical template in the dev-standards
# repository, and emits a warning annotation on drift. It never fails the
# build: drift is a reminder to sync, not an error.
#
# When DEV_STANDARDS_TOKEN is not configured, the comparison is skipped with
# a notice instead of failing — passing an unset secret straight to
# actions/checkout would hard-fail the job with "Input required and not
# supplied: token". (secrets can't be tested directly in `if:` expressions
# here, so the token is mapped to a job-level env var and probed in a step.)
#
# Requirements (manual, one-time per project repo):
#   - A fine-grained PAT with Contents: Read access to
#     tomatomerde/dev-standards, stored as the Actions secret
#     DEV_STANDARDS_TOKEN (dev-standards is private).

on:
  pull_request:
    paths:
      - CLAUDE.md
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    env:
      DEV_STANDARDS_TOKEN: ${{ secrets.DEV_STANDARDS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check whether the dev-standards token is configured
        id: token
        run: |
          if [ -n "${DEV_STANDARDS_TOKEN}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice file=CLAUDE.md::Maintainer-only check skipped: DEV_STANDARDS_TOKEN is not available (expected on pull requests from forks — nothing for contributors to do here). ／ メンテナ用チェックをスキップしました。fork からの PR では正常な動作で、コントリビュータ側の対応は不要です。有効化はメンテナが Actions シークレットで行います。"
          fi
      - name: Check out the canonical template
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: tomatomerde/dev-standards
          token: ${{ secrets.DEV_STANDARDS_TOKEN }}
          path: .dev-standards
      - name: Compare common section against canonical template
        if: steps.token.outputs.present == 'true'
        run: |
          extract() { awk '/^# ここから下は共通/,0' "$1"; }
          if diff <(extract .dev-standards/CLAUDE.template.md) <(extract CLAUDE.md); then
            echo "Common section matches the canonical template."
          else
            echo "::warning file=CLAUDE.md::共通部分が dev-standards の原本からずれています。原本と同期してください（diff は上のログ参照）"
          fi
